<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电子军师</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3eee3;color:#1c1a17;font:15px "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#141311;color:#ece5d6}p{color:#807869!important}}
  div{text-align:center}
  .seal{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:6px;background:#c8372d;color:#f7f2e8;font:900 36px "Songti SC","Noto Serif SC",serif;transform:rotate(-5deg);box-shadow:inset 0 0 0 5px #c8372d,inset 0 0 0 7px #f7f2e8}
  b{display:block;font:900 20px "Songti SC","Noto Serif SC",serif;letter-spacing:.12em;margin-bottom:6px}
  p{margin:0;color:#8c8477}
</style>
<div><div class="seal">军</div><b id="name">电子军师</b><p id="wait">正在铺纸研墨，第一次打开要几秒…</p></div>
<script src="./lang.js"></script>
</html>
